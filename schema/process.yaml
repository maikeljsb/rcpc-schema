id: https://rcpc.for5672/schema/process
name: process
version: 0.1.0
description: >-
  Tasks and how they decompose. PrimitiveTask, CompoundTask, and Method as the
  catalogue; TaskNetwork, CompoundTaskInstance, and PrimitiveTaskInstance as a
  plan: what is asked for, and each planned occurrence bound to components,
  spaces, and machines.
prefixes:
  rcpc: https://rcpc.for5672/schema/
  linkml: https://w3id.org/linkml/
default_prefix: rcpc
default_range: string
imports:
  - linkml:types
  - common
  - product
  - resource

enums:
  ParameterKind:
    description: The kinds of object a parameter ranges over.
    permissible_values:
      component:
        description: A BuildingComponent, or one of its subclasses.
      location:
        description: A Space.
      robot:
        description: One machine of a RobotUnit entry.

classes:
  Task:
    description: >-
      HDDL's task: a name and typed parameters, before it is said whether the
      task is primitive or compound. The base of PrimitiveTask and CompoundTask;
      never written as a record.
    slots:
      - record_type
      - id
      - description
      - parameters
    slot_usage:
      id:
        pattern: "^[A-Za-z][A-Za-z0-9_]*$"
        description: The task name, unique among the tasks and methods of the catalogue.
      description:
        required: true
      parameters:
        required: true

  PrimitiveTask:
    is_a: Task
    description: >-
      HDDL's action: a task a robot performs directly, with what performing it
      requires and how long it takes. Its name is what a behaviour tree registers.
    slots:
      - requires
      - duration
    slot_usage:
      duration:
        required: true

  CompoundTask:
    is_a: Task
    description: >-
      HDDL's abstract task: a task performed only by decomposing it through a
      method. Adds nothing to Task; the class is the kind.

  Method:
    description: >-
      One way to decompose a compound task into an ordered network of subtasks,
      for components of one material category or for any component.
    slots:
      - record_type
      - id
      - description
      - compound_task
      - applies_to
      - parameters
      - subtasks
      - ordering
      - uses
    slot_usage:
      id:
        pattern: "^[A-Za-z][A-Za-z0-9_]*$"
        description: The method name.
      description:
        required: true
      compound_task:
        required: true
      parameters:
        required: true
      subtasks:
        range: Subtask
        inlined: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
      ordering:
        required: true

  Parameter:
    description: >-
      HDDL's typed variable: one declared parameter of a task or a method, its
      name and the kind of object it ranges over. Written inline, keyed by the
      parameter's name.
    slots:
      - parameter_name
      - parameter_kind
    slot_usage:
      parameter_kind:
        required: true

  Subtask:
    description: >-
      One entry of a method's subtask list: the task it names and the
      arguments it passes, in that task's parameter order. Its position in the
      list, counted from 1, is what ordering refers to.
    slots:
      - primitive_task
      - compound_task
      - arguments
    slot_usage:
      arguments:
        required: true
    rules:
      - description: A subtask names exactly one task, primitive or compound.
        preconditions:
          slot_conditions:
            arguments:
              required: true
        postconditions:
          exactly_one_of:
            - slot_conditions:
                primitive_task:
                  required: true
            - slot_conditions:
                compound_task:
                  required: true

  TaskNetwork:
    description: >-
      HDDL's initial task network: what the plan is asked to accomplish, the
      compound task instances no compound lists as a subtask, in list order,
      with the ordering among them.
    slots:
      - record_type
      - id
      - tasks
      - ordering
    slot_usage:
      id:
        pattern: "^[A-Za-z][A-Za-z0-9_]*$"
        description: The network's name.
      tasks:
        required: true
      ordering:
        required: true

  TaskInstance:
    description: >-
      One planned occurrence of a task, before it is said whether the task is
      primitive or compound. The base of CompoundTaskInstance and
      PrimitiveTaskInstance and the range a compound instance's subtasks share;
      never written as a record.
    slots:
      - record_type
      - id
      - bindings
    slot_usage:
      id:
        description: The instance's id, unique within the plan.
      bindings:
        required: true

  CompoundTaskInstance:
    is_a: TaskInstance
    description: >-
      One planned occurrence of a compound task: the task, the method chosen to
      decompose it, and the instances that replaced it, one per line of the
      method's subtasks and in the same order.
    slots:
      - compound_task
      - decomposed_by
      - subtasks
    slot_usage:
      compound_task:
        required: true
      decomposed_by:
        required: true
      subtasks:
        range: TaskInstance
        required: true

  PrimitiveTaskInstance:
    is_a: TaskInstance
    description: >-
      One planned occurrence of a primitive task: the action and every parameter
      of it bound to an object.
    slots:
      - primitive_task
    slot_usage:
      primitive_task:
        required: true

  ParameterBinding:
    description: >-
      One parameter of a task instance bound to one object. Written inline,
      keyed by the parameter's name; what kind of object the id names is read
      from the parameter's declaration on the bound task or method.
    slots:
      - parameter_name
      - bound_to
    slot_usage:
      bound_to:
        required: true

slots:
  parameters:
    range: Parameter
    multivalued: true
    inlined: true
    description: The declared parameters, keyed by name.
  parameter_name:
    key: true
    description: The parameter's name, a plain word such as c, r, or from.
  parameter_kind:
    range: ParameterKind
    description: The kind of object the parameter ranges over.
  applies_to:
    range: MaterialCategory
    description: >-
      The material category of the components a method decomposes its task for;
      a component matches when the Material it is made_of has that category.
      Absent when the method applies to any component.
  uses:
    range: Stock
    multivalued: true
    description: >-
      The stocks a method holds one unit of each for its whole span. Absent when
      the method uses no stock.
  requires:
    range: CapabilityType
    multivalued: true
    required: true
    minimum_cardinality: 1
    description: The capabilities a robot must offer to perform the primitive task.
  duration:
    range: Quantity
    inlined: true
    description: How long one performance of the primitive task takes, recommended in seconds.
  compound_task:
    range: CompoundTask
    description: The compound task a method decomposes, a subtask names, or an instance realises.
  primitive_task:
    range: PrimitiveTask
    description: The primitive task a subtask names or an instance realises.
  subtasks:
    multivalued: true
    description: >-
      The subtasks in list order, counted from 1. On a method, the entries of its
      decomposition; on a compound task instance, the instances that replaced it.
  ordering:
    range: integer
    array:
      exact_number_dimensions: 2
      dimensions:
        - alias: pair
        - exact_cardinality: 2
    description: >-
      Pairs of positions in the owner's subtask or task list; in each pair the
      first ends before the second starts. Empty when unordered.
  arguments:
    multivalued: true
    description: >-
      The values a subtask passes, in the named task's parameter order: method
      parameter names or object ids.
  tasks:
    range: CompoundTaskInstance
    multivalued: true
    minimum_cardinality: 1
    description: The network's tasks in list order, counted from 1, each position its label.
  decomposed_by:
    range: Method
    pattern: "^$|^[A-Za-z][A-Za-z0-9_]*$"
    description: The method chosen to decompose a compound task instance. Empty until chosen.
  bindings:
    range: ParameterBinding
    multivalued: true
    inlined: true
    description: The instance's parameters bound to object ids, keyed by parameter name.
  bound_to:
    description: >-
      The id of the object the parameter is bound to: a BuildingComponent, a
      Space, or a machine such as mason_m1_1, as the parameter's declared kind
      says.
