id: https://rcpc.for5672/schema/common
name: common
version: 0.1.0
description: >-
  Shared vocabulary for the Product Process Graph: value types, the material name
  type, the parameter kinds, and the capability types. Imported by every other module.
prefixes:
  rcpc: https://rcpc.for5672/schema/
  linkml: https://w3id.org/linkml/
default_prefix: rcpc
default_range: string
imports:
  - linkml:types

classes:
  CapabilityType:
    description: >-
      Something a robot can do, named by a verb. Required by primitive tasks and
      offered by robot types.
    slots:
      - id
      - description
    slot_usage:
      description:
        required: true

slots:
  id:
    identifier: true
    description: Identifier, unique among instances of its class.
  description:
    description: What this is, in one or two plain sentences.
