id: https://rcpc.for5672/schema/common
name: common
version: 0.1.0
description: >-
  Shared vocabulary for the Product Process Graph: value types, the material name
  type, the parameter kinds, and the capability types. Imported by every other module.
prefixes:
  rcpc: https://rcpc.for5672/schema/
  linkml: https://w3id.org/linkml/
default_prefix: rcpc
default_range: string
imports:
  - linkml:types

types:
  MaterialName:
    typeof: string
    description: An IFC material name, exactly as it appears in the model.

enums:
  ParameterKind:
    description: The kinds of value a task parameter can hold.
    permissible_values:
      position:
        description: A Position.
      component_reference:
        description: A reference to a BuildingComponent, by id.
      quantity:
        description: A Quantity.

classes:
  Position:
    description: A cartesian point in the IFC project coordinate frame.
    slots:
      - x_coord
      - y_coord
      - z_coord
    slot_usage:
      x_coord:
        required: true
      y_coord:
        required: true
      z_coord:
        required: true

  Quantity:
    description: A number with a unit.
    slots:
      - value
      - unit
    slot_usage:
      value:
        required: true
      unit:
        required: true

  CapabilityType:
    description: >-
      Something a robot can do, named by a verb. Required by primitive tasks and
      offered by robots.
    slots:
      - id
      - description
    slot_usage:
      description:
        required: true

slots:
  id:
    identifier: true
    description: Identifier, unique among instances of its class.
  description:
    description: What this is, in one or two plain sentences.
  x_coord:
    range: float
    description: Cartesian x coordinate.
  y_coord:
    range: float
    description: Cartesian y coordinate.
  z_coord:
    range: float
    description: Cartesian z coordinate.
  value:
    range: float
    description: The numeric value.
  unit:
    description: The unit of the value.
