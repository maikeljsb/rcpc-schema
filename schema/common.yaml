id: https://rcpc.for5672/schema/common
name: common
version: 0.1.0
description: >-
  Shared vocabulary for the Product Process Graph: value types, the material
  categories, and the capability types. Imported by every other module.
prefixes:
  rcpc: https://rcpc.for5672/schema/
  linkml: https://w3id.org/linkml/
default_prefix: rcpc
default_range: string
imports:
  - linkml:types

enums:
  MaterialCategory:
    description: >-
      The categories of material a construction method is written for, IFC's
      IfcMaterial.Category as this project's vocabulary.
    permissible_values:
      masonry:
        description: Brick, block, and stone, laid or prefabricated as a unit.
      timber:
        description: Wood, solid or engineered, including joisted floors and roofs.
      concrete:
        description: Cast or precast concrete, including slabs and foundation walls.
      unassigned:
        description: No category yet; the parser writes it and a mapping step replaces it.

classes:
  Position:
    description: "Three cartesian coordinates and their unit: a point, or an extent along each axis."
    slots:
      - x_coord
      - y_coord
      - z_coord
      - unit
    slot_usage:
      x_coord:
        required: true
      y_coord:
        required: true
      z_coord:
        required: true
      unit:
        required: true

  Quantity:
    description: A number with a unit.
    slots:
      - value
      - unit
    slot_usage:
      value:
        required: true
      unit:
        required: true

  Interval:
    description: A lower and an upper bound with their unit.
    slots:
      - minimum
      - maximum
      - unit
    slot_usage:
      minimum:
        required: true
      maximum:
        required: true
      unit:
        required: true

  CapabilityType:
    description: >-
      Something a robot can do, named by a verb. Required by primitive tasks and
      offered by robots.
    slots:
      - id
      - description
    slot_usage:
      description:
        required: true

slots:
  id:
    identifier: true
    description: Identifier, unique among instances of its class.
  description:
    description: What this is, in one or two plain sentences.
  x_coord:
    range: float
    description: Cartesian x coordinate.
  y_coord:
    range: float
    description: Cartesian y coordinate.
  z_coord:
    range: float
    description: Cartesian z coordinate.
  value:
    range: float
    description: The numeric value.
  minimum:
    range: float
    description: The lower bound.
  maximum:
    range: float
    description: The upper bound.
  unit:
    description: The unit of the value, of the coordinates, or of the bounds.
  length:
    range: Quantity
    inlined: true
    description: How long the item is, recommended in metres.
  width:
    range: Quantity
    inlined: true
    description: How wide the item is, recommended in metres.
  height:
    range: Quantity
    inlined: true
    description: How tall the item is, recommended in metres.
  weight:
    range: Quantity
    inlined: true
    description: How much the item weighs, recommended in kilograms.
