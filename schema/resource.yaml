id: https://rcpc.for5672/schema/resource
name: resource
version: 0.1.0
description: >-
  Robots as resources. One RobotUnit entry per robot product, holding the four
  Construction Robot Schema groups and the capabilities the robot offers.
prefixes:
  rcpc: https://rcpc.for5672/schema/
  linkml: https://w3id.org/linkml/
default_prefix: rcpc
default_range: string
imports:
  - linkml:types
  - common

enums:
  RobotStatus:
    description: The runtime state of one machine.
    permissible_values:
      idle:
        description: Not currently assigned to any task.
      deployed:
        description: Actively performing a task.
      charging:
        description: Recharging and unavailable for assignment.
      out_of_service:
        description: Unavailable for assignment due to maintenance or failure.

classes:
  RobotUnit:
    description: >-
      One robot product, entered from its Construction Robot Schema attributes.
      Identical machines are one entry with a count.
    slots:
      - id
      - count
      - status
      - physical_property
      - operational_requirement
      - safety_group
      - activity_group
    slot_usage:
      id:
        description: The robot's name, a readable product slug. The CRS Name.
      activity_group:
        required: true

  PhysicalProperty:
    description: >-
      CRS group 1: the robot's physical dimensions, hardware, and performance.
    slots:
      - id
      - manufacturer
      - level_of_autonomy
      - network
      - length
      - width
      - height
      - weight
      - load_capacity
      - mobility
      - speed
      - navigation
      - power_source
      - run_duration
      - end_effector
      - manipulator
      - coordinate_reach
      - yaw
      - pitch
      - roll
      - manipulator_position
      - degree_of_freedom
      - lifting_capacity
      - sensors

  Sensor:
    description: >-
      One sensor on or around the robot. Belongs to the PhysicalProperty
      group one hop down.
    slots:
      - id
      - sensor_type
      - sensor_requirements
      - sensor_location

  OperationalRequirement:
    description: >-
      CRS group 2: the site conditions and the people the robot needs to work.
    slots:
      - id
      - grade_min
      - grade_max
      - temperature_min
      - temperature_max
      - humidity
      - site_preparation
      - req_number_operators
      - operator_responsibilities

  Safety:
    description: >-
      CRS group 3: how the robot protects the people and objects around it.
    slots:
      - id
      - emergency_stop
      - safe_distance
      - object_detection_range
      - safety_barrier
      - additional_ppe_requirements
      - minimum_workspace

  Activity:
    description: >-
      CRS group 4: the capabilities a robot offers and how it performs them.
      The one required group, because offers is required.
    slots:
      - id
      - offers
      - productivity
      - precision
      - accuracy
      - data_output_type
      - data_output_file_type
      - crew_information
      - crew_responsibilities
      - worker_type
      - worker_responsibilities


slots:
  # Slots of RobotUnit
  count:
    range: integer
    minimum_value: 1
    required: true
    description: How many identical machines this entry stands for.
  status:
    range: RobotStatus
    ifabsent: RobotStatus(idle)
    description: The runtime state of one machine.
  physical_property:
    range: PhysicalProperty
    inlined: true
    description: The Physical Property group holding the robot's dimensions, hardware, and performance.
  operational_requirement:
    range: OperationalRequirement
    inlined: true
    description: The Operational Requirement group holding the site conditions and people the robot needs.
  safety_group:
    range: Safety
    inlined: true
    description: The Safety group holding how the robot protects the people and objects around it.
  activity_group:
    range: Activity
    inlined: true
    description: The Activity group holding this robot's offered capabilities.

  # Slots of PhysicalProperty
  manufacturer:
    description: Who makes the robot.
  level_of_autonomy:
    description: How independently the robot performs its tasks.
  network:
    description: How the robot communicates and exchanges data.
  load_capacity:
    range: Quantity
    inlined: true
    description: The maximum weight the robot can carry for extended work, recommended in kilograms.
  mobility:
    description: How the robot moves from one place to another.
  speed:
    range: Quantity
    inlined: true
    description: How fast the robot travels, recommended in metres per second.
  navigation:
    range: boolean
    description: Whether the robot can find its own position and plan a path to a destination.
  power_source:
    description: What supplies the robot's energy.
  run_duration:
    range: Quantity
    inlined: true
    description: How long the robot can run continuously on its power source, recommended in minutes.
  end_effector:
    multivalued: true
    description: The tools the robot's manipulator can attach, such as a bucket or gripper.
  manipulator:
    description: "The robot's arm: the links and joints that perform tasks."
  coordinate_reach:
    range: Position
    inlined: true
    description: How far the manipulator reaches along each of the robot's three axes, recommended in metres. The CRS Coordinate Reach X, Y and Z.
  yaw:
    range: Quantity
    inlined: true
    description: The manipulator's rotation range around the vertical axis, recommended in degrees.
  pitch:
    range: Quantity
    inlined: true
    description: The manipulator's rotation range around the lateral axis, recommended in degrees.
  roll:
    range: Quantity
    inlined: true
    description: The manipulator's rotation range around the longitudinal axis, recommended in degrees.
  manipulator_position:
    range: Position
    inlined: true
    description: Where the manipulator is mounted on the robot, a point in the robot's own frame.
  degree_of_freedom:
    range: integer
    description: How many axes of the manipulator can rotate or extend.
  lifting_capacity:
    range: Quantity
    inlined: true
    description: The maximum weight the manipulator can lift during operation, recommended in kilograms.
  sensors:
    range: Sensor
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: The sensors mounted on or around the robot.

  # Slots of Sensor
  sensor_type:
    description: What kind of sensor this is.
  sensor_requirements:
    description: What installing the sensor requires.
  sensor_location:
    range: Position
    inlined: true
    description: Where the sensor sits on the robot, a point in the robot's own frame.

  # Slots of OperationalRequirement
  grade_min:
    range: Quantity
    inlined: true
    description: The gentlest ground slope the robot can work on, recommended in degrees. The lower bound of the CRS Grade.
  grade_max:
    range: Quantity
    inlined: true
    description: The steepest ground slope the robot can work on, recommended in degrees. The upper bound of the CRS Grade.
  temperature_min:
    range: Quantity
    inlined: true
    description: The lowest temperature at which the robot works properly, recommended in degrees Celsius. The lower bound of the CRS Temperature.
  temperature_max:
    range: Quantity
    inlined: true
    description: The highest temperature at which the robot works properly, recommended in degrees Celsius. The upper bound of the CRS Temperature.
  humidity:
    range: Quantity
    inlined: true
    description: The highest relative humidity at which the robot works properly, recommended in percent.
  site_preparation:
    description: What the site needs before the robot can work properly on it.
  req_number_operators:
    range: integer
    description: How many people control the robot.
  operator_responsibilities:
    description: What the operator does while the robot performs its tasks.

  # Slots of Safety
  emergency_stop:
    range: boolean
    description: Whether the robot stops automatically and immediately when specific conditions are triggered.
  safe_distance:
    range: Quantity
    inlined: true
    description: The minimum distance to keep between humans and the robot while they work together, recommended in metres.
  object_detection_range:
    range: Quantity
    inlined: true
    description: How far away the robot can detect and recognise objects, recommended in metres.
  safety_barrier:
    range: boolean
    description: Whether the robot has a facility to avoid collisions with humans or objects.
  additional_ppe_requirements:
    multivalued: true
    description: Extra personal protective equipment required when humans operate or work with the robot.
  minimum_workspace:
    range: Quantity
    inlined: true
    description: The minimum space the robot needs to operate without collisions, recommended in metres.

  # Slots of Activity
  offers:
    range: CapabilityType
    multivalued: true
    required: true
    description: The capability types this robot offers. The CRS Task Type.
  productivity:
    range: Quantity
    inlined: true
    description: How much work the robot does per unit of time, in a unit that fits the activity, for example brick/h. The CRS Productivity with its Productivity Units.
  precision:
    range: Quantity
    inlined: true
    description: How finely the robot repeats its work, recommended in millimetres. The CRS Precision with its Precision Units.
  accuracy:
    range: Quantity
    inlined: true
    description: How close the robot's work comes to the target, recommended in millimetres. The CRS Accuracy with its Accuracy Units.
  data_output_type:
    multivalued: true
    description: The forms of data the robot's sensors output.
  data_output_file_type:
    multivalued: true
    description: The file formats of the data the robot's sensors output.
  crew_information:
    description: The composition of the team working with the robot.
  crew_responsibilities:
    description: What the crew does while the robot performs its tasks.
  worker_type:
    multivalued: true
    description: The kinds of worker who work with the robot.
  worker_responsibilities:
    description: What the workers do while the robot performs its tasks.
