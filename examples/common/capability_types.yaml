- id: locomotion
  label: Locomotion
  description: >-
    Moving the robot itself, or a held payload, from one pose to another. Required by every task that repositions something.
- id: gripper
  label: Gripper
  description: >-
    Grasping and releasing a discrete component, the attach/detach pair. Required by tasks that take custody of a component.
- id: lifting
  label: Lifting
  description: >-
    Bearing and raising a component's weight. Distinct from `gripper`: holding is not lifting, and a robot may offer one without the other.
- id: alignment
  label: Alignment
  description: >-
    Positioning a component to a stated tolerance. Required by tasks whose success is defined by a tolerance rather than by arrival.
